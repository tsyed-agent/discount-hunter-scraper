name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'   # only runs when rules file actually changes
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Firestore Security Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Firestore rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules
        env:
          # Same service account used by the scraper workflows.
          # In Firebase Console → Project Settings → Service Accounts →
          # "Generate new private key" → copy the full JSON as this secret.
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
