name: Price Poll

on:
  schedule:
    # Every 4 hours — updates currentPrice, minBid, bidCount, and status for all
    # lots via HiBid's GraphQL API.
    #
    # Quota note: change-detection reads every lot once per run. A large catalog
    # (this auctioneer routinely lists 5,000+ lots) polled hourly would exceed
    # the Firestore Spark free tier (50,000 reads/day). Every 4 hours keeps a
    # 5k-lot catalog at ~30k reads/day. Tighten the cron only if your catalog is
    # small or you are on a paid Firestore plan.
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'manual'

jobs:
  price-poll:
    name: Price Poll
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run price poll
        env:
          SYNC_MODE: price
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node src/scheduler.js
