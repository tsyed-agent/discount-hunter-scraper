name: Price Poll (Hourly)

on:
  schedule:
    # Every hour — updates currentPrice, minBid, bidCount for all active lots.
    # Fast path: tries HiBid status API first; falls back to full page scan.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'manual'

jobs:
  price-poll:
    name: Price Poll
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run price poll
        env:
          SYNC_MODE: price
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node src/scheduler.js
